name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days without activity.
# This hits the REST API on a schedule so the database never goes idle
# long enough to be suspended.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' "$PING_URL")
          echo "HTTP $code"
          head -c 200 /tmp/body.txt
          test "$code" = "200"
        env:
          PING_URL: ${{ secrets.SUPABASE_PING_URL }}
